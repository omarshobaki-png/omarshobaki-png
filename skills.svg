      fill="#0d0d10" stroke="#a5a5b3" stroke-width="1" stroke-opacity="0.55"/>
    <text x="457" y="148" fill="#f7f7fb"
      font-family="ui-monospace, monospace" font-size="13"
      letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">
      TYPESCRIPT
    </text>
  </g>

  <g class="chip5">
    <rect x="520" y="134" width="51" height="28" rx="14"
      fill="#0d0d10" stroke="#a5a5b3" stroke-width="1" stroke-opacity="0.55"/>
    <text x="545.5" y="148" fill="#f7f7fb"
      font-family="ui-monospace, monospace" font-size="13"
      letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">
      GIT
    </text>
  </g>

  <g class="chip6">
    <rect x="581" y="134" width="67" height="28" rx="14"
      fill="#0d0d10" stroke="#a5a5b3" stroke-width="1" stroke-opacity="0.55"/>
    <text x="614.5" y="148" fill="#f7f7fb"
      font-family="ui-monospace, monospace" font-size="13"
      letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">
      LINUX
    </text>
  </g>

  <g class="chip7">
    <rect x="658" y="134" width="43" height="28" rx="14"
      fill="#0d0d10" stroke="#a5a5b3" stroke-width="1" stroke-opacity="0.55"/>
    <text x="679.5" y="148" fill="#f7f7fb"
      font-family="ui-monospace, monospace" font-size="13"
      letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">
      C
    </text>
  </g>
</svg>