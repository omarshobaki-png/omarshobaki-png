<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    text {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system,
      "Segoe UI", Roboto, sans-serif;
    }

    @keyframes chip0 {
      0%,0% { opacity: 0; transform: translateY(6px) }
      2%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip1 {
      0%,3% { opacity: 0; transform: translateY(6px) }
      5%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip2 {
      0%,5% { opacity: 0; transform: translateY(6px) }
      7%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip3 {
      0%,8% { opacity: 0; transform: translateY(6px) }
      10%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip4 {
      0%,10% { opacity: 0; transform: translateY(6px) }
      12%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip5 {
      0%,13% { opacity: 0; transform: translateY(6px) }
      15%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip6 {
      0%,15% { opacity: 0; transform: translateY(6px) }
      17%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    @keyframes chip7 {
      0%,18% { opacity: 0; transform: translateY(6px) }
      20%,92% { opacity: 1; transform: translateY(0) }
      97%,100% { opacity: 0 }
    }

    .chip0 { animation: chip0 9s ease-out infinite; }
    .chip1 { animation: chip1 9s ease-out infinite; }
    .chip2 { animation: chip2 9s ease-out infinite; }
    .chip3 { animation: chip3 9s ease-out infinite; }
    .chip4 { animation: chip4 9s ease-out infinite; }
    .chip5 { animation: chip5 9s ease-out infinite; }
    .chip6 { animation: chip6 9s ease-out infinite; }
    .chip7 { animation: chip7 9s ease-out infinite; }
  </style>

  <rect width="100%" height="100%" fill="#0d0d10" rx="14" ry="14"/>

  <rect x="56" y="74" width="56" height="3" rx="1.5" fill="#dc2626"/>

  <text
    x="56"
    y="56"
    fill="#f7f7fb"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.02em"
  >
    Stack.
  </text>

  <text
    x="56"
    y="104"
    fill="#a5a5b3"
    font-size="13"
    font-weight="500"
    letter-spacing="0.02em"
  >
    Tools &amp; technologies I work with.
  </text>

  <g class="chip0">
    <rect x="80" y="134" width="75" height="28" rx="14"
      fill="#0d0d10" stroke="#a5a5b3" stroke-width="1" stroke-opacity="0.55"/>
    <text x="117.5" y="148" fill="#f7f7fb"
      font-family="ui-monospace, monospace" font-size="13"
      letter-spacing="0.8" text-anchor="middle" dominant-baseline="middle">
      PYTHON
